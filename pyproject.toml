[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechinterp-experiments"
version = "0.1.0"
description = "Mechanistic interpretability experiments for SFT and RLVR."
authors = [
    {name = "Kanishk", email = "kanishk@example.com"}
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "datasets>=2.19.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "black",
    "flake8"
]
